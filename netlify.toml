
# netlify.toml — business-response.pagerduty.com
# This site now only redirects to docs.pagerduty.com/ops-guides/business-incident-response.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# These are attached to the 301 responses too. Referrer-Policy matters here:
# a redirect response's Referrer-Policy is applied to the follow-up request,
# so "same-origin" would strip the referrer when the browser goes on to
# docs.pagerduty.com (cross-origin), and docs analytics would lose the
# original traffic source (Google, blogs, Slack, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Redirects — first match wins. Keep the catch-all LAST.
# force = true is required because the old MkDocs build output (if still
# deployed) would otherwise shadow these rules.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "https://docs.pagerduty.com/ops-guides/business-incident-response"
  status = 301
  force = true

[[redirects]]
  from = "/definitions/*"
  to = "https://docs.pagerduty.com/ops-guides/business-incident-response/definitions"
  status = 301
  force = true

[[redirects]]
  from = "/what_is/*"
  to = "https://docs.pagerduty.com/ops-guides/business-incident-response/what-is-a-business-incident"
  status = 301
