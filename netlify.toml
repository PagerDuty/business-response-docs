# Catch-all: assets, sitemap.xml, search index, /before/, /during/,
# unknown/mistyped URLs
[[redirects]]
  from = "/*"
  to = "https://docs.pagerduty.com/ops-guides/business-incident-response"
  status = 301
  force = true
